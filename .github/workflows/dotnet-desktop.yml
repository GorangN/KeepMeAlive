name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: Require all production release gates (does not publish a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm run build
        working-directory: backend

  desktop:
    runs-on: windows-latest
    needs: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_UI_LANGUAGE: en
      KEEP_ME_ALIVE_DEV_API_URL: ${{ vars.KEEP_ME_ALIVE_DEV_API_URL }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore KeepMeAlive.sln --locked-mode
      - name: Build without warnings
        run: dotnet build KeepMeAlive.sln -c Release --no-restore
      - name: Test application workflows
        run: dotnet test KeepMeAlive.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Audit NuGet dependencies
        run: ./scripts/Audit-Dependencies.ps1
      - name: Verify production account packaging gates
        run: ./scripts/Test-ProductionGates.ps1
      - name: Verify release signatures and portable archive gates
        run: ./scripts/Test-SigningGates.ps1
      - name: Verify development backend
        if: env.KEEP_ME_ALIVE_DEV_API_URL != ''
        run: ./scripts/Test-Backend.ps1 -BaseUrl $env:KEEP_ME_ALIVE_DEV_API_URL
      - name: Build and verify complete distribution packages
        run: |
          $compiler = ./scripts/Install-InnoSetup.ps1
          ./scripts/Build-Packages.ps1 -InnoCompiler $compiler
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: KeepMeAlive-validation
          path: |
            artifacts/packages/*
            artifacts/test-results/*
            artifacts/audit/*
          if-no-files-found: error
          retention-days: 14

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: [backend, desktop]
    environment: production
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_UI_LANGUAGE: en
      KEEP_ME_ALIVE_SMTP_VERIFIED: ${{ vars.KEEP_ME_ALIVE_SMTP_VERIFIED }}
      KEEP_ME_ALIVE_OAUTH_VERIFIED: ${{ vars.KEEP_ME_ALIVE_OAUTH_VERIFIED }}
      KEEP_ME_ALIVE_DEV_API_URL: ${{ vars.KEEP_ME_ALIVE_DEV_API_URL }}
      WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require production acceptance and authorized signing inputs
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ($env:KEEP_ME_ALIVE_SMTP_VERIFIED -ne 'true' -or $env:KEEP_ME_ALIVE_OAUTH_VERIFIED -ne 'true') {
            throw 'Production requires verified email delivery and completed OAuth acceptance.'
          }
          if (-not $env:KEEP_ME_ALIVE_DEV_API_URL) { throw 'Production requires a tested development API URL.' }
          if (-not $env:WINDOWS_SIGNING_PUBLISHER) { throw 'Production requires the expected public WINDOWS_SIGNING_PUBLISHER subject.' }
          if (-not $env:SIGNING_CERT_BASE64 -or -not $env:SIGNING_CERT_PASSWORD) {
            throw 'Production requires an authorized exportable PFX and its password in the production environment secrets.'
          }
      - name: Import authorized production-signing certificate
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'keepmealive-release.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            "WINDOWS_SIGNING_IMPORTED_THUMBPRINTS=$($imported.Thumbprint -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append
            $certificates = @($imported | Where-Object { $_.HasPrivateKey -and $_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3' })
            if ($certificates.Count -ne 1) { throw 'The PFX must contain exactly one code-signing certificate with its authorized private key.' }
            "WINDOWS_SIGNING_CERT_THUMBPRINT=$($certificates[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
          }
      - name: Validate production configuration and signer before building
        run: ./scripts/Build-Packages.ps1 -RequireProduction -ValidateOnly
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify development backend
        run: ./scripts/Test-Backend.ps1 -BaseUrl $env:KEEP_ME_ALIVE_DEV_API_URL
      - name: Build signed production packages and verify final artifacts
        run: |
          $compiler = ./scripts/Install-InnoSetup.ps1
          ./scripts/Build-Packages.ps1 -InnoCompiler $compiler -RequireProduction
      - name: Remove imported production-signing material
        if: always()
        run: |
          foreach ($thumbprint in ($env:WINDOWS_SIGNING_IMPORTED_THUMBPRINTS -split ';')) {
            if ($thumbprint -and (Test-Path -LiteralPath ('Cert:\CurrentUser\My\' + $thumbprint))) {
              Remove-Item -LiteralPath ('Cert:\CurrentUser\My\' + $thumbprint) -Force
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KeepMeAlive-production
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
